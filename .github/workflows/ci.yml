name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test plugin generator
        run: |
          printf 'export default { test: { include: ["scripts/build-plugins.test.ts"] } }\n' > "$RUNNER_TEMP/vitest-plugins.config.mjs"
          npx vitest run --config "$RUNNER_TEMP/vitest-plugins.config.mjs"

      - name: Build
        run: npm run build

      - name: Committed dist is up to date
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- dist || (echo "dist/ is stale - run npm run build and commit it" && exit 1)

      - name: Check generated plugins
        run: npm run build:plugins -- --check

      - name: Smoke install
        run: bash scripts/smoke-install.sh

      - name: One-line installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm pack --pack-destination $env:RUNNER_TEMP
          $env:EDU_ASSET = (Get-ChildItem "$env:RUNNER_TEMP\edu-agent-*.tgz").FullName
          ./scripts/install.ps1
          edu --version

      - name: One-line installer (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          EDU_ASSET="$(ls "$RUNNER_TEMP"/edu-agent-*.tgz)" bash scripts/install.sh
          edu --version
