name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs; main and manual runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Pi API for integration contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/edu-pi-protocol" --no-package-lock --no-fund --no-audit @earendil-works/pi-coding-agent@1.2.0
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PI_PROTOCOL_ROOT=' + require('node:path').join(process.env.RUNNER_TEMP, 'edu-pi-protocol', 'node_modules', '@earendil-works', 'pi-coding-agent') + '\n')"

      - name: Typecheck
        run: npm run typecheck

      # Bug-finding lint (type-aware promise rules and core correctness); see eslint.config.js.
      - name: Lint
        run: npm run lint

      # Unit and contract tests (scripts/**/*.test.ts included). Linux runs them with the coverage ratchet.
      - name: Test
        if: runner.os != 'Linux'
        run: npm test -- --maxWorkers=2

      - name: Test with coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage -- --maxWorkers=2

      # Wall-clock budgets: one quiet OS, retried (see the perf project in vitest.config.ts).
      - name: Performance budgets
        if: runner.os == 'Linux'
        run: npm run test:perf

      - name: Build
        run: npm run build

      - name: Committed dist is up to date
        if: runner.os == 'Linux'
        run: node scripts/check-dist.mjs

      - name: Check generated plugins
        run: npm run build:plugins -- --check

      - name: Smoke install
        run: bash scripts/smoke-install.sh

      - name: Pack verified candidate
        run: |
          mkdir -p "$RUNNER_TEMP/edu-candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/edu-candidate"
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'EDU_CANDIDATE=' + require('node:path').join(process.env.RUNNER_TEMP, 'edu-candidate', 'edu-agent-' + require('./package.json').version + '.tgz') + '\n')"

      - name: Upgrade with the published updaters
        run: |
          mkdir -p "$RUNNER_TEMP/edu-baselines"
          curl -fsSL --retry 2 https://github.com/EduardoMoraga/edu/releases/download/v0.10.2/edu-agent-0.10.2.tgz -o "$RUNNER_TEMP/edu-baselines/0.10.2.tgz"
          curl -fsSL --retry 2 https://github.com/EduardoMoraga/edu/releases/download/v2.0.0-rc.1/edu-agent-2.0.0-rc.1.tgz -o "$RUNNER_TEMP/edu-baselines/2.0.0-rc.1.tgz"
          curl -fsSL --retry 2 https://github.com/EduardoMoraga/edu/releases/download/v5.0.1/edu-agent-5.0.1.tgz -o "$RUNNER_TEMP/edu-baselines/5.0.1.tgz"
          node -e "const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');for(const [v,h] of Object.entries({'0.10.2':'0cc31fa000265bd2a4cdba32fa76b558fd741b9d47442954d8f8a9b44fa12fbc','2.0.0-rc.1':'45a5f921e65f766aefc6021d1faa8b3af22a2812d8fc2007cc88e12475a7b573','5.0.1':'a62f067e94f16e78abee8a9f2aab9e02049dac911bb8e8c326f6dbc6e69efc42'})){if(c.createHash('sha256').update(fs.readFileSync(p.join(process.env.RUNNER_TEMP,'edu-baselines',v+'.tgz'))).digest('hex')!==h)throw Error('Published baseline checksum changed: '+v)}"
          node scripts/smoke-upgrade.mjs "$RUNNER_TEMP/edu-baselines/0.10.2.tgz" "$EDU_CANDIDATE" 0.10.2
          node scripts/smoke-upgrade.mjs "$RUNNER_TEMP/edu-baselines/2.0.0-rc.1.tgz" "$EDU_CANDIDATE" 2.0.0-rc.1
          node scripts/smoke-upgrade.mjs "$RUNNER_TEMP/edu-baselines/5.0.1.tgz" "$EDU_CANDIDATE" 5.0.1

      - name: Install from committed source without checkout dependencies
        run: node scripts/smoke-source.mjs

      - name: One-line installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EDU_ASSET = $env:EDU_CANDIDATE
          ./scripts/install.ps1
          edu --version
          node scripts/mcp-smoke.mjs

      - name: One-line installer (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          EDU_ASSET="$EDU_CANDIDATE" bash scripts/install.sh
          edu --version
          node scripts/mcp-smoke.mjs

  node-versions:
    name: Node ${{ matrix.node }} on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Pi API for integration contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/edu-pi-protocol" --no-package-lock --no-fund --no-audit @earendil-works/pi-coding-agent@1.2.0
          echo "PI_PROTOCOL_ROOT=$RUNNER_TEMP/edu-pi-protocol/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --maxWorkers=2

  install-matrix:
    name: Install matrix (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup, uninstall and restore in clean containers
        run: bash scripts/install-matrix.sh node:22-bookworm-slim node:24-alpine
