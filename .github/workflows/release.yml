name: Release

# Tag pushes only, never pull requests. Re-running a release is safe: scripts/release.ts leaves assets
# already published with the same digest alone, completes an interrupted draft and refuses to replace
# a published asset with different bytes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance (Sigstore)
      attestations: write # store the provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release builds from the lockfile alone.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tag matches package.json
        run: node --experimental-strip-types scripts/release.ts check-tag "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Pi API for integration contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/edu-pi-protocol" --no-package-lock --no-fund --no-audit @earendil-works/pi-coding-agent@1.2.0
          echo "PI_PROTOCOL_ROOT=$RUNNER_TEMP/edu-pi-protocol/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Typecheck, test and build
        run: npm run check

      - name: Committed dist matches the build
        run: node scripts/check-dist.mjs

      - name: Generated plugins are up to date
        run: npm run build:plugins -- --check

      - name: Pack edu-agent-<version>.tgz, edu-agent.tgz and SHA256SUMS
        run: |
          rm -rf "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          node --experimental-strip-types scripts/release.ts assets "$RUNNER_TEMP/release"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/release.ts publish "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
