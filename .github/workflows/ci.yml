name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Pi API for integration contracts
        run: |
          npm install --prefix "$RUNNER_TEMP/edu-pi-protocol" --no-package-lock --no-fund --no-audit @earendil-works/pi-coding-agent@1.2.0
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PI_PROTOCOL_ROOT=' + require('node:path').join(process.env.RUNNER_TEMP, 'edu-pi-protocol', 'node_modules', '@earendil-works', 'pi-coding-agent') + '\n')"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --maxWorkers=2

      - name: Test plugin generator
        run: |
          printf 'export default { test: { include: ["scripts/build-plugins.test.ts"] } }\n' > "$RUNNER_TEMP/vitest-plugins.config.mjs"
          npx vitest run --config "$RUNNER_TEMP/vitest-plugins.config.mjs" --maxWorkers=2

      - name: Build
        run: npm run build

      - name: Committed dist is up to date
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- dist || (echo "dist/ is stale - run npm run build and commit it" && exit 1)

      - name: Check generated plugins
        run: npm run build:plugins -- --check

      - name: Smoke install
        run: bash scripts/smoke-install.sh

      - name: Pack verified candidate
        run: |
          mkdir -p "$RUNNER_TEMP/edu-candidate"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/edu-candidate"
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'EDU_CANDIDATE=' + require('node:path').join(process.env.RUNNER_TEMP, 'edu-candidate', 'edu-agent-' + require('./package.json').version + '.tgz') + '\n')"

      - name: Upgrade with both published updaters
        run: |
          mkdir -p "$RUNNER_TEMP/edu-baselines"
          curl -fsSL --retry 2 https://github.com/EduardoMoraga/edu/releases/download/v0.10.2/edu-agent-0.10.2.tgz -o "$RUNNER_TEMP/edu-baselines/0.10.2.tgz"
          curl -fsSL --retry 2 https://github.com/EduardoMoraga/edu/releases/download/v2.0.0-rc.1/edu-agent-2.0.0-rc.1.tgz -o "$RUNNER_TEMP/edu-baselines/2.0.0-rc.1.tgz"
          node -e "const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto');for(const [v,h] of Object.entries({'0.10.2':'0cc31fa000265bd2a4cdba32fa76b558fd741b9d47442954d8f8a9b44fa12fbc','2.0.0-rc.1':'45a5f921e65f766aefc6021d1faa8b3af22a2812d8fc2007cc88e12475a7b573'})){if(c.createHash('sha256').update(fs.readFileSync(p.join(process.env.RUNNER_TEMP,'edu-baselines',v+'.tgz'))).digest('hex')!==h)throw Error('Published baseline checksum changed: '+v)}"
          node scripts/smoke-upgrade.mjs "$RUNNER_TEMP/edu-baselines/0.10.2.tgz" "$EDU_CANDIDATE" 0.10.2
          node scripts/smoke-upgrade.mjs "$RUNNER_TEMP/edu-baselines/2.0.0-rc.1.tgz" "$EDU_CANDIDATE" 2.0.0-rc.1

      - name: Install from committed source without checkout dependencies
        run: node scripts/smoke-source.mjs

      - name: One-line installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EDU_ASSET = $env:EDU_CANDIDATE
          ./scripts/install.ps1
          edu --version
          node scripts/mcp-smoke.mjs

      - name: One-line installer (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          EDU_ASSET="$EDU_CANDIDATE" bash scripts/install.sh
          edu --version
          node scripts/mcp-smoke.mjs
